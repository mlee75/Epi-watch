[project]
name = "gta6-clipper"
version = "0.1.0"
description = "Semi-automated clipping pipeline for paid Content Rewards campaigns"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6",
  "yt-dlp>=2026.1.1",
]

[project.optional-dependencies]
captions = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools]
packages = ["clipper"]

[tool.setuptools.package-data]
clipper = ["review.html"]
