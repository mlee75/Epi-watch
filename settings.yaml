# Global defaults. Any campaign file can override clip, render and captions settings.

cookies_from_browser: ""   # set to chrome or safari on your Mac if YouTube asks to sign in

# Clips you keep are copied here with their caption, so you can post from your phone.
# Default is iCloud Drive > Clips (Files app on iPhone). Set "" to turn off.
phone_folder: "~/Library/Mobile Documents/com~apple~CloudDocs/Clips"
send_all_to_phone: true    # every rendered clip goes to the phone folder; false = only clips you keep

creator_fee: 0.10        # Content Rewards fee on CPM payouts, taken at settlement

clip:
  top: 6                 # clips per VOD
  pre: 20                # seconds before the peak moment
  post: 10               # seconds after it
  min_gap: 45            # minimum seconds between two clips
  chat_weight: 1.0       # how much chat spikes count vs audio spikes

render:
  layout: smart          # smart = 9:16 crop that follows the action, blur = whole frame on blurred fill
  hook_seconds: 4        # how long the hook text stays on screen
  cta_seconds: 3         # how long the call to action shows at the end
  short_source: 75       # sources shorter than this (Twitch clips) are rendered whole

captions:
  enabled: false         # burn word-by-word captions (needs: pip install -e '.[captions]')
  model: small           # faster-whisper model: tiny, base, small, medium
  language: en
